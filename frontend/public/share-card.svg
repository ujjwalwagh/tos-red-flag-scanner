<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Deep graphite canvas -->
  <rect width="1200" height="630" fill="#101315"/>

  <!-- Subtle architectural precision grid -->
  <defs>
    <pattern id="card-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1D2428" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#card-grid)" opacity="0.6"/>

  <!-- Interior document intelligence card -->
  <rect x="64" y="64" width="1072" height="502" rx="16" fill="#161B1E" stroke="#252F35" stroke-width="2"/>

  <!-- Integrated architectural logo mark -->
  <g transform="translate(112, 112)">
    <rect width="88" height="88" rx="18" fill="#1A2125" stroke="#2C373E" stroke-width="2"/>
    <!-- Scaled document mark inside -->
    <path d="M 28 18 H 54 L 64 28 V 70 H 28 Z" fill="#20292E" stroke="#36434B" stroke-width="1.5"/>
    <path d="M 54 18 V 28 H 64 Z" fill="#29343B" stroke="#36434B" stroke-width="1.5"/>
    <rect x="34" y="27" width="2" height="36" fill="#36434B"/>
    <rect x="39" y="30" width="20" height="2" fill="#64748B"/>
    <!-- Red risk pip -->
    <rect x="33.5" y="38" width="3" height="10" rx="1" fill="#DC2626"/>
    <rect x="39" y="39" width="22" height="2.5" fill="#F1F5F9"/>
    <rect x="39" y="44" width="16" height="2" fill="#3874CB"/>
    <rect x="39" y="52" width="18" height="2" fill="#475569"/>
    <rect x="39" y="58" width="14" height="2" fill="#334155"/>
  </g>

  <!-- Brand Typography -->
  <text x="224" y="148" fill="#3874CB" font-size="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="700" letter-spacing="3">TERMS OF SERVICE ANALYSIS</text>
  <text x="224" y="190" fill="#F8FAFC" font-size="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="700">TOS Red Flag Scanner</text>

  <!-- Editorial Hero Subtitle -->
  <text x="112" y="280" fill="#F1F5F9" font-size="34" font-family="'Palatino Linotype', 'Georgia', serif" font-weight="600">Understand what you're agreeing to.</text>

  <!-- Supporting Copy -->
  <text x="112" y="336" fill="#94A3B8" font-size="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="400">
    <tspan x="112" dy="0">Scan complex legal agreements, detect critical risk clauses, evaluate their real-world</tspan>
    <tspan x="112" dy="32">impact, and ask questions with citations grounded directly in the document.</tspan>
  </text>

  <!-- Technical Feature Capability Pills -->
  <g transform="translate(112, 452)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="210" height="42" rx="8" fill="#1C2327" stroke="#2B363C" stroke-width="1.5"/>
    <text x="24" y="26" fill="#CBD5E1" font-size="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="600">URL · PDF · Plain Text</text>

    <!-- Pill 2 -->
    <rect x="226" y="0" width="230" height="42" rx="8" fill="#1C2327" stroke="#2B363C" stroke-width="1.5"/>
    <text x="250" y="26" fill="#CBD5E1" font-size="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="600">Strict &amp; Broad Auditing</text>

    <!-- Pill 3 -->
    <rect x="472" y="0" width="230" height="42" rx="8" fill="#1C2327" stroke="#2B363C" stroke-width="1.5"/>
    <text x="496" y="26" fill="#CBD5E1" font-size="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="600">Evidence-Grounded Q&amp;A</text>

    <!-- Pill 4 -->
    <rect x="718" y="0" width="240" height="42" rx="8" fill="#1C2327" stroke="#2B363C" stroke-width="1.5"/>
    <text x="742" y="26" fill="#CBD5E1" font-size="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="600">Zero-Retention In-Memory</text>
  </g>
</svg>
